# THE MEASUREMENT WORKFLOW — every sharded table a planner QUOTES, and nothing that must merely hold.
#
# ⚖ The standing rule (automation arc, 2026-09-22): **a new sharded TABLE goes here; only a row that must HOLD goes
# in `sweep.yml`.** A measurement is a decision input — its rows pass on "the cell completed, twice equal" and its
# verdict is labelled "(report)". A gate asserts a pinned mark, a hash, an inertness or a constructed behaviour.
#
# What lives here: the F1 reset-frequency matrix; R3b-2's `ptr` table (the weight x policy x variant sweep whose
# verdict NAMES a configuration); R3c's rung sweep (which weight reaches the rung's marks first); C1c's buying table.
#
# ⛔ WHY IT IS NOT IN `sweep.yml`, measured 2026-09-21/22. It used to live there, gated on the event being a
# dispatch. Two things were wrong with that, and only the second is obvious:
#   · `sweep.yml` is `concurrency: sweep-${{ github.ref }}` with `cancel-in-progress`, and a DISPATCH on `main` and
#     a PUSH to `main` share that group — so any push KILLED a campaign in flight. It happened twice in two days:
#     run 35646386975 (34 measurement jobs succeeded, 7 cancelled) and 35636667015 (16 succeeded, 4 cancelled).
#     Most of a ~5.5 runner-hour matrix, thrown away by an unrelated push.
#   · dispatching the sweep at a branch is how EVERY slice in both arcs gets M1 and G1, because the sweep only runs
#     on push to `main` — so the event test could not tell "run the roster on my branch" from "re-decide a reset
#     default", and every slice started the matrix. `tmt-assets-1`, a media-compression slice touching no
#     automation code at all, paid for a full one.
# An input (`f1: false`) fixed the second and not the first; its own workflow fixes both, and needs no input — so
# the `inputs.f1 == 'true'` trap (a boolean compared with a string is ALWAYS false) cannot come back either.
#
# ⚖ `f1-rows` stays in `sweep.yml`: it is the cheap `maxRow` gate that must run on every push. What is here is the
# MEASUREMENT — a table a planner quotes, not a row count that must hold.
#
# TO RUN ONE:  gh workflow run measurements.yml --ref <branch>
#
# ⚠ `cancel-in-progress` IS set for this workflow's own group: a second dispatch superseding a first is a choice
# someone made; a push killing a campaign is not. That is the whole distinction this file exists to draw.
# ⚠ These jobs no longer `needs: fast` — a job cannot depend on one in another workflow. The units are cheap and
# already gate every push; a measurement dispatched by hand does not need them re-run first.

name: measurements

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measurements-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local and CI must agree, because the merge's verdicts are compared against a local full sweep's.
  NODE_VERSION: '18.20.6'
  SHARDS: '10'

jobs:

  # ---------------------------------------------------------------------------------------------------------------
  # F1 — HOW OFTEN SHOULD A RESET FIRE, scored at the page's REAL tick (`diff 0.05`; plan §46–§48).
  # One cell per job, each cell TWICE (`gates-f1 --cell <key>`); the merge re-reads every cell file of a part and
  # REFUSES a missing one by name (LESS LOOKS GREENER). A real-tick leg costs ~20× the wall of a `diff 1` leg per
  # game-second, so the long cells (the opening, M15 → M25) exist only here; `--wall-ms` is the graceful bound (a
  # run killed by the job's own timeout writes nothing), set under `timeout-minutes`.
  # ---------------------------------------------------------------------------------------------------------------
  f1-cells:
    # ⚖ MANUAL ONLY (user, 2026-09-21): a MEASUREMENT table, not a gate — ~5.5 runner-hours per run, its slowest
    # cells the configurations that WALL (they burn their whole real-tick budget). Run it from the Actions tab
    # (workflow_dispatch) when a reset default is being re-decided; `f1-rows` is the F1 gate that runs on every push.
    name: F1 cell ${{ matrix.cell }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        cell: ['E@1/off', 'E@0.05/off', 'R2@1/off', 'R2@0.05/off', 'R3@1/off', 'R3@0.05/off',
               'E@1/yield', 'E@0.05/yield', 'R2@1/yield', 'R2@0.05/yield', 'R3@1/yield', 'R3@0.05/yield',
               'O@1/off', 'O@1/yield', 'O@0.05/off', 'O@0.05/yield',
               'L3@1/off', 'L3@1/yield', 'L3@0.05/off', 'L3@0.05/yield']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: "F1 cell ${{ matrix.cell }}, twice"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-f1.mjs --cell '${{ matrix.cell }}' --wall-ms 5400000 --pool 2 \
            --no-summary --assert | tee f1-cell.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## F1 cell ${{ matrix.cell }}'
            echo ''
            echo '```'
            cat f1-cell.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|^GREEN|PROGRESS' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the cell
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-cell-${{ strategy.job-index }}
          path: tools/harness/results/gates-f1-cell-*.json
          if-no-files-found: warn
          retention-days: 14


  # F1-fix: the ladder's fixtures regenerated under the shipped configuration (after F1), the shipped leg TWICE from
  # a FRESH game — ONE chain, M01 onward — every mark's snapshot written by each run into its own directory and compared file by file;
  # both sets are uploaded and a fixture is committed only from a run whose twin agreed.
  f1-fixtures:
    # ⚖ MANUAL ONLY (user, 2026-09-21): a MEASUREMENT table, not a gate — ~5.5 runner-hours per run, its slowest
    # cells the configurations that WALL (they burn their whole real-tick budget). Run it from the Actions tab
    # (workflow_dispatch) when a reset default is being re-decided; `f1-rows` is the F1 gate that runs on every push.
    name: F1 fixtures — the shipped leg from a fresh game, twice
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: F1 part fix
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-f1.mjs --part fix --wall-ms 5400000 --no-summary --assert | tee f1-fix.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## F1 fixtures'
            echo ''
            echo '```'
            cat f1-fix.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|^GREEN' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload both runs' fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-fixtures
          path: tools/harness/results/f1-fixtures/
          if-no-files-found: warn
          retention-days: 14


  # Parts 2 and 3 run as GROUPS (`--group`): a group is the cells that share a stretch, so one runner walks them
  # side by side and the long row-3 cells get a job each.
  f1-groups:
    # ⚖ MANUAL ONLY (user, 2026-09-21): a MEASUREMENT table, not a gate — ~5.5 runner-hours per run, its slowest
    # cells the configurations that WALL (they burn their whole real-tick budget). Run it from the Actions tab
    # (workflow_dispatch) when a reset default is being re-decided; `f1-rows` is the F1 gate that runs on every push.
    name: F1 group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group: ['ST', 'L3-gain2x', 'L3-stall5',
                'X:the-extended-tree', 'X:prestige-tree-ng', 'X:the-normal-tree', 'X:the-omega-tree',
                'X:the-function-of-time-tree', 'X:the-pp-tree', 'X:the-point-tree', 'X:weakling-tree',
                'P3-P', 'P3-R2', 'P3-E', 'P3-O',
                'P3-L3-q gain>=2', 'P3-L3-q gain>=4', 'P3-L3-q gain>=8', 'P3-L3-q,h gap>=60s', 'P3-L3-e gain>=16x']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: "F1 group ${{ matrix.group }}, every cell twice"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-f1.mjs --group '${{ matrix.group }}' --wall-ms 5400000 --pool 4 \
            --no-summary --assert | tee f1-group.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## F1 group ${{ matrix.group }}'
            echo ''
            echo '```'
            cat f1-group.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|^GREEN|PROGRESS' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the group
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-group-${{ strategy.job-index }}
          path: tools/harness/results/gates-f1-cell-*.json
          if-no-files-found: warn
          retention-days: 14


  f1-merge:
    name: F1 merge — every cell present, the tables and the verdicts
    needs: [f1-cells, f1-groups]
    # manual only, like the cells it merges; `!cancelled()` still runs it when a cell FAILED
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: f1-*
          path: cells
          merge-multiple: true

      - name: Merge parts 0 (the tick calibration), 1 (the yield), 2 (the derived default) and 3 (the throttle)
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-f1.mjs --part m --cell 0 --from cells --no-summary --assert | tee f1-m0.txt
          node tools/harness/gates-f1.mjs --part m --cell 1 --from cells --no-summary --assert | tee f1-m1.txt
          node tools/harness/gates-f1.mjs --part m --cell 2 --from cells --no-summary --assert | tee f1-m2.txt
          node tools/harness/gates-f1.mjs --part m --cell 3 --from cells --no-summary --assert | tee f1-m3.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## F1 merge'
            echo ''
            echo '```'
            cat f1-m0.txt f1-m1.txt f1-m2.txt f1-m3.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # R3b-2 part 2 — ptr's TABLE, one CELL per job. Nine whole-stretch cells × two runs is over an hour on one box
  # and a few minutes of wall here, because the cells are independent runs of the same leg.
  # ⛔ `--horizon` IS NOT OPTIONAL FOR A SHARD: unsharded the sweep takes its horizon from its own first cell, and
  # sharded each job has its own first cell — so a shard in which every cell stopped short would agree with itself.
  # The battery refuses `--shard` without it. 37048 = `all/M15.json` (16048) + 21,000 ticks at diff 1.
  r3b2-table:
    name: R3b-2 ptr's table — shard ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: "Part 2 — the table, shard ${{ matrix.shard }}/5"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-r3b2.mjs --part 2 --shard ${{ matrix.shard }}/5 --horizon 37048 \
            --no-summary --assert --pool 2 | tee r3b2-2-${{ matrix.shard }}.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## R3b-2 table shard ${{ matrix.shard }}/5'
            echo ''
            echo '```'
            cat r3b2-2-${{ matrix.shard }}.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|CELLS|^RED|^GREEN' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `always()`: a RED shard still produced rows, and the merge wants them.
      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3b2-table-${{ matrix.shard }}
          path: tools/harness/results/gates-r3b2-part2-shard*.json
          if-no-files-found: warn
          retention-days: 14


  # ⛔ THE MERGE, AND IT IS THE POINT OF SHARDING RATHER THAN A FORMALITY. LESS LOOKS FASTER AND GREENER: a shard
  # that dies before running anything prints no rows, and no rows is no reds. This job reassembles the cell list
  # from the artifacts and REFUSES a run that does not put the whole table back together — the same assertion
  # `merge-shards.mjs` makes about the roster.
  r3b2-table-merge:
    name: R3b-2 ptr's table — merge + cell assertion
    needs: r3b2-table
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: r3b2-table-*
          path: shards
          merge-multiple: true

      - name: Reassemble the table
        shell: bash
        run: |
          set -o pipefail
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = "shards";
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => f.endsWith(".json")) : [];
            const seen = new Map(), rows = [];
            let red = 0;
            for (const f of files) {
              const d = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              const i = d.shard ? d.shard.i : null, n = d.shard ? d.shard.n : null;
              if (i === null) { console.error(`REFUSED: ${f} carries no shard index`); process.exit(1); }
              seen.set(i, { n, cells: d.cells || [] });
              for (const r of d.rows || []) { rows.push(r); if (!r.ok) red++; }
            }
            const n = seen.size ? [...seen.values()][0].n : 0;
            const missing = [];
            for (let i = 1; i <= n; i++) if (!seen.has(i)) missing.push(i);
            const cells = [...seen.values()].flatMap((v) => v.cells);
            console.log(`shards present ${seen.size}/${n}; cells reassembled ${cells.length}; rows ${rows.length}; ${red} RED`);
            console.log(JSON.stringify(cells, null, 1));
            if (!seen.size) { console.error("REFUSED: no shard artifacts at all — a matrix that never started is not a green table"); process.exit(1); }
            if (missing.length) { console.error(`REFUSED: shard(s) ${missing.join(",")} produced no artifact — LESS LOOKS GREENER`); process.exit(1); }
            if (red) { console.error(`REFUSED: ${red} RED row(s) across the table`); process.exit(1); }
          ' | tee merge.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## R3b-2 table — merge'
            echo ''
            echo '```'
            cat merge.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # ---------------------------------------------------------------------------------------------------------------
  # V4 — the per-feature CONTROLS (`while`, `until`, `priority`) and the M21 pause (plan §27).
  #
  # ⚖ WHAT IS IN CI AND WHAT IS NOT, by V2's and V3's rule:
  #   · parts 1, 3, 4 and 5 are CHEAP-ish and each is a claim a later slice will lean on — that a typed predicate
  #     COMPILES before it is committed and a throw is contained to its feature, that the `until` latch survives a
  #     RELOAD (it is the only reason it means anything to a player), that `priority` is the kind's place until
  #     somebody moves it, and that a build carrying all of it is byte-identical when nobody has used it. They run here.
  #   · parts 6 and 8 are the PAGE, which is where V1's, V2's and V3's real defects were found. It runs here.
  #   · ⛔ part 2 does NOT: it is two 16,000-tick ladder legs (~25 min), and what it asserts — a table entry and a
  #     saved edit are the same slot — is also asserted on the stub in part 1, cheaply. It is run by hand and quoted
  #     in the as-built with the head it ran at.
  #   · ⛔ parts `m21` / `derived` are MEASUREMENT TABLES, not gates (V3 part 4's rule: a measurement table is not a
  #     gate), and `fix` WRITES fixtures. All three are run by hand.
  #   · ⛔ part 7 does NOT, for V2 part 6's and V3 part 6's reason: a 171-game page walk needs sharding and a merge
  #     assertion to be honest.
  #
  # ⛔ `--assert` on every part: exiting 1 on a red row does NOT catch a battery that stopped part-way.
  # ---------------------------------------------------------------------------------------------------------------
  # ---------------------------------------------------------------------------------------------------------------
  # R3c Part 2 — THE RUNG, UNINTERRUPTED from `all/M15.json` (the fixture M16–M25 were measured from): the q/h turn
  # weight against M26's wall (q22's price is beaten only by a larger energy multiplier, i.e. more QUIRKS), 50,000
  # ticks, twice per cell, one cell per job, a GIVEN horizon. `r3c-fixtures` runs the shipped cell twice more, writing
  # every mark's snapshot, and uploads both sets — the fixtures are committed from a run whose twin agrees.
  # ---------------------------------------------------------------------------------------------------------------
  r3c-rung:
    name: R3c the rung from all/M15 — cell ${{ matrix.cell }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cell: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: "Part 2 — cell ${{ matrix.cell }}, twice"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-r3c.mjs --part 2 --cell ${{ matrix.cell }} --horizon 58168 \
            --no-summary --assert --pool 2 | tee r3c-2-${{ matrix.cell }}.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## R3c part 2 cell ${{ matrix.cell }}'
            echo ''
            echo '```'
            cat r3c-2-${{ matrix.cell }}.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|^GREEN' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the cell
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3c-rung-${{ matrix.cell }}
          path: tools/harness/results/gates-r3c-part2-cell*.json
          if-no-files-found: warn
          retention-days: 14


  r3c-rung-merge:
    name: R3c the rung from all/M15 — merge
    needs: r3c-rung
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: r3c-rung-*
          path: cells
          merge-multiple: true

      - name: Merge the four cells
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-r3c.mjs --part 2m --from cells --no-summary --assert | tee r3c-2m.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## R3c part 2 — merge'
            echo ''
            echo '```'
            cat r3c-2m.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  # C1c Part 2 — BUYING THE WORD IDS IS A BEHAVIOUR CHANGE, measured before it ships: the seven games whose purchase
  # enumeration changed, each fresh (3600 game-s) and LIFTED (the reader's lift on the live state, 600 ticks), at HEAD
  # twice, against the RECORDING of the commit before C1c (tools/harness/recorded/c1c-before.json; S1T, ⚖ R12/R13 —
  # it used to run that commit in a control worktree and needed `fetch-depth: 0`). A MEASUREMENT:
  # its rows pass on "every leg ran, twice equal"; the table is the finding.
  # ---------------------------------------------------------------------------------------------------------------
  c1c-buy:
    name: C1c buying the word ids — before → after (part 2)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Part 2 — seven games, fresh and lifted, HEAD twice and the commit before
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-c1c.mjs --part 2 --no-summary --assert --pool 4 | tee c1c-2.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## C1c part 2 — buying the word ids'
            echo ''
            echo '```'
            cat c1c-2.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|^GREEN' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1c-buy
          path: tools/harness/results/gates-c1c-part*.json
          if-no-files-found: warn
          retention-days: 14
