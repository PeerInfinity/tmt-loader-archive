      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3b2-inert
          path: tools/harness/results/gates-r3b2-part*.json
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------------
  # R3c Part 1 — the dead-member rule's `mark`: the shipped LAST ANCHOR against a true HIGH-WATER (and the
  # high-water cleared on the member's own reset), the WHOLE stretch `all/M15.json` → 21,000 ticks, twice per cell.
  # ⛔ SHARDED BY CELL, because three cells of that leg do not fit a 10-minute local wall side by side (measured at
  # R3c: seven processes walled every cell at ~33,600 game-s). ONE horizon, GIVEN (`--horizon`), so a shard can never
  # agree with a horizon it measured itself; the merge refuses a missing cell by name and holds BOTH ends to known
  # answers: `turnMark=last` = R3b-2's shipped cell (37048 / `6e0e67d4b2836e8e`), the default = the adopted
  # `high-act` (37048 / `3602cc81c88ebd17`, CI run 35566730632).
  # ---------------------------------------------------------------------------------------------------------------
  r3c-mark:
    name: R3c the dead-member rule's mark — cell ${{ matrix.cell }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cell: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: "Part 1 — cell ${{ matrix.cell }}, twice"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-r3c.mjs --part 1 --cell ${{ matrix.cell }} --horizon 37048 \
            --no-summary --assert --pool 2 | tee r3c-1-${{ matrix.cell }}.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## R3c part 1 cell ${{ matrix.cell }}'
            echo ''
            echo '```'
            cat r3c-1-${{ matrix.cell }}.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|^GREEN' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the cell
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3c-mark-${{ matrix.cell }}
          path: tools/harness/results/gates-r3c-part1-cell*.json
          if-no-files-found: warn
          retention-days: 14

  r3c-mark-merge:
    name: R3c the dead-member rule's mark — merge + both pinned ends
    needs: r3c-mark
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: r3c-mark-*
          path: cells
          merge-multiple: true

      - name: Merge the three cells
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-r3c.mjs --part 1m --from cells --no-summary --assert | tee r3c-1m.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## R3c part 1 — merge'
            echo ''
            echo '```'
            cat r3c-1m.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  # V4 — the per-feature CONTROLS (`while`, `until`, `priority`) and the M21 pause (plan §27).
  #
  # ⚖ WHAT IS IN CI AND WHAT IS NOT, by V2's and V3's rule:
  #   · parts 1, 3, 4 and 5 are CHEAP-ish and each is a claim a later slice will lean on — that a typed predicate
  #     COMPILES before it is committed and a throw is contained to its feature, that the `until` latch survives a
  #     RELOAD (it is the only reason it means anything to a player), that `priority` is the kind's place until
  #     somebody moves it, and that a build carrying all of it is byte-identical when nobody has used it. They run here.
  #   · parts 6 and 8 are the PAGE, which is where V1's, V2's and V3's real defects were found. It runs here.
  #   · ⛔ part 2 does NOT: it is two 16,000-tick ladder legs (~25 min), and what it asserts — a table entry and a
  #     saved edit are the same slot — is also asserted on the stub in part 1, cheaply. It is run by hand and quoted
  #     in the as-built with the head it ran at.
  #   · ⛔ parts `m21` / `derived` are MEASUREMENT TABLES, not gates (V3 part 4's rule: a measurement table is not a
  #     gate), and `fix` WRITES fixtures. All three are run by hand.
  #   · ⛔ part 7 does NOT, for V2 part 6's and V3 part 6's reason: a 171-game page walk needs sharding and a merge
  #     assertion to be honest.
  #
  # ⛔ `--assert` on every part: exiting 1 on a red row does NOT catch a battery that stopped part-way.
  # ---------------------------------------------------------------------------------------------------------------
  r3c-fixtures:
    name: R3c the rung's fixtures — the shipped leg twice
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Part 2f — the shipped leg twice, every mark's snapshot, compared
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-r3c.mjs --part 2f --no-summary --assert | tee r3c-2f.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## R3c part 2f — fixtures'
            echo ''
            echo '```'
            cat r3c-2f.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|^GREEN' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3c-fixtures
          path: tools/harness/results/r3c-fixtures/
          if-no-files-found: warn
          retention-days: 14

  # The rung CHAINED on from the committed all/M27.json, as every ladder fixture before it was: M26 (q22) arrives past
  # the 50,000-tick horizon from M15 (a resumed chain put it at ~83,900), so this leg writes its fixture twice.
  r3c-fixtures-m27:
    name: R3c the rung's fixtures — chained from all/M27.json (M26)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Part 2f — the shipped leg twice, every mark's snapshot, compared
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-r3c.mjs --part 2f --fixture tools/harness/snapshots/ptr/all/M27.json --ticks 50000 --no-summary --assert | tee r3c-2f.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## R3c part 2f — fixtures from M27'
            echo ''
            echo '```'
            cat r3c-2f.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|^GREEN' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3c-fixtures-m27
          path: tools/harness/results/r3c-fixtures/
          if-no-files-found: warn
          retention-days: 14

  v4-node:
    name: V4 controls — headless (parts 1, 3, 4, 5)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ⚠ `npm ci` but NO `playwright install`: these parts import the package and never launch a browser.
      - run: npm ci

      - name: Part 1 — schema ≡ behaviour, and both new codes on a real leg
        shell: bash  # bash -eo pipefail: without it `| tee` reports the pipe's status and a refusal is lost
        run: |
          set -o pipefail
          node tools/harness/gates-v4.mjs --part 1 --no-summary --assert --pool 2 | tee v4-1.txt

      - name: Part 3 — the `until` latch across a RELOAD, and the re-arm
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v4.mjs --part 3 --no-summary --assert --pool 2 | tee v4-3.txt

      - name: Part 4 — priority, the identity and the move
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v4.mjs --part 4 --no-summary --assert --pool 3 | tee v4-4.txt

      - name: Part 5 — inertness, the opening and M15 → M20
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v4.mjs --part 5 --no-summary --assert --pool 2 | tee v4-5.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## V4 controls — headless'
            echo ''
            echo '```'
            cat v4-1.txt v4-3.txt v4-4.txt v4-5.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|green$' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-node
          path: tools/harness/results/tmp/gates-v4-part*-last.json
          if-no-files-found: warn
          retention-days: 14

  v4-page:
    name: V4 controls — in the page (parts 6, 8)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # ⚠ The predicate is TYPED with a real keyboard and it CONTAINS the letters both engines bind as hotkeys, so
      # the typing leg IS the hotkey leg; and the latch is believed only after a real `save()` and a real reload.
      - name: Part 6 — a predicate typed, refused, stopped, reloaded, re-armed; a priority edited; markup inert
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v4.mjs --part 6 --no-summary --assert | tee v4-6.txt

      # ⚠ The reset is driven with its REAL two presses on a REALISTICALLY configured save, and its specification is
      # a deep-equal against a fresh boot — never a field list, which would go stale the next time this arc adds one.
      - name: "Part 8 — the reset: two presses, the save back to a fresh boot's, the runtime with it, the GAME unmoved"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v4.mjs --part 8 --no-summary --assert | tee v4-8.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## V4 controls — in the page'
            echo ''
            echo '```'
            cat v4-6.txt v4-8.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|green$' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-page
          path: tools/harness/results/tmp/gates-v4-part*-last.json
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------------
  # V3 — the PROGRESS TRACKER, the STALL WATCH and the collapsible Advanced blocks (plan §21).
  #
  # ⚖ WHAT IS IN CI AND WHAT IS NOT, and why, for the same reason V2's split has:
  #   · parts 1, 2 and 3 are CHEAP and every one of them is a claim a later slice will lean on — that the core's
  #     progress rule IS the harness detector's, that V3 switched off leaves every committed snapshot valid, and that
  #     the escalation machine does what it says on a CONSTRUCTED state no real fixture reaches. They run here.
  #   · part 5 is the PAGE, and the page is where V1's and V2's real defects were found (an unwitnessed vocabulary, a
  #     `null` that killed four engines' `load()`, a stale view — §18.4 item 11). It runs here.
  #   · ⛔ part 4 does NOT: it is ~40 minutes of ladder legs whose whole point is to REPORT numbers for R2's sweep,
  #     and a measurement table is not a gate. It is run by hand and quoted in the as-built with the head it ran at.
  #   · ⛔ part 6 does NOT, for V2 part 6's reason: a 171-game page walk needs sharding and a merge assertion to be
  #     honest, and it is the one-off witness that the three subtabs open across the roster.
  #
  # ⛔ `--assert` on every part: exiting 1 on a red row does NOT catch a battery that stopped part-way — it prints
  # fewer rows, and fewer rows is fewer reds. Each part declares the row count it emits.
  # ---------------------------------------------------------------------------------------------------------------
  v3-node:
    name: V3 progress + watch — headless (parts 1, 2, 3)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ⚠ `npm ci` but NO `playwright install`: these parts import the package and never launch a browser.
      - run: npm ci

      - name: Part 3 — the machine, constructed on the stub
        shell: bash  # bash -eo pipefail: without it `| tee` reports the pipe's status and a refusal is lost
        run: |
          set -o pipefail
          node tools/harness/gates-v3.mjs --part 3 --no-summary --assert | tee v3-3.txt

      - name: Part 1 — the core's progress rule ≡ the harness monitor's
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v3.mjs --part 1 --no-summary --assert --pool 2 | tee v3-1.txt

      - name: Part 2 — inertness, and no full-hash pin moved
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v3.mjs --part 2 --no-summary --assert --pool 2 | tee v3-2.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## V3 progress + watch — headless'
            echo ''
            echo '```'
            cat v3-3.txt v3-1.txt v3-2.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|green$' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-node
          path: tools/harness/results/tmp/gates-v3-part*-last.json
          if-no-files-found: warn
          retention-days: 14

  v3-page:
    name: V3 progress + watch — in the page (part 5)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # ⚠ The collapse arm is PAIRED against the thing that breaks it: the tab re-renders every tick, so the leg
      # ticks, switches subtab and RELOADS before it believes the fold survived.
      - name: Part 5 — the watch toggles, a list edit persists, Progress renders, every block folds
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v3.mjs --part 5 --no-summary --assert | tee v3-5.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## V3 progress + watch — in the page'
            echo ''
            echo '```'
            cat v3-5.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|green$' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-page
          path: tools/harness/results/tmp/gates-v3-part*-last.json
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------------
  # S1 part 1 — the automation anchors. 52 checks, 197 s locally, and EVERY slice this arc has run it by hand to
  # prove no anchor moved. That is exactly the check that should not depend on a human remembering.
  #
  # ⚠ Its own job, in parallel with the matrix, NOT folded into `fast`: at ~3.3 min it is the second most expensive
  # thing here, and `fast` is worth having only because it finishes in seconds.
  #
  # Depth 1 (S1T, 2026-09-29; ⚖ R12/R13). Each pinned row used to re-run the COMMIT that first recorded it in a
  # throwaway `git worktree` (3bc12bf, 17260e03, 71da72e), which needed `fetch-depth: 0`. It now compares against a
  # RECORDING of those runs, tools/harness/recorded/s1-baselines.json — see gates-s1.mjs for what that changes.
  # ---------------------------------------------------------------------------------------------------------------
  # ---- V5: the Advanced tab — the WRAP, NO JUMP, the RETRY conditions -----------------------------------------------
  v5-page:
    name: V5 Advanced tab — in the page (parts 1, 2)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # ⚠ Part 1 judges every interactive element against the viewport AND its pane, at 390 px with and without
      # `?mobile=1` and at 1280, on ptr and something — and that the tab's root IS its pane's width, because a column
      # that shrink-wrapped to nothing would pass "nothing past the edge" vacuously (contain:inline-size did, measured).
      - name: "Part 1 — the WRAP, on ptr AND something"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v5.mjs --part 1 --no-summary --assert | tee v5-1.txt

      # ⚠ Part 2's floors-ON rows are evidence only beside its floors-OFF CONTROL rows, which must see the same
      # constructed transitions move things.
      - name: "Part 2 — NO JUMP: constructed transitions, their controls, and real play"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v5.mjs --part 2 --no-summary --assert | tee v5-2.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## V5 Advanced tab — in the page'
            echo ''
            echo '```'
            cat v5-1.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|green$' || echo 'no output'
            cat v5-2.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|green$' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-page
          path: tools/harness/results/tmp/gates-v5-part*-last.json
          if-no-files-found: warn
          retention-days: 14

  v5-node:
    name: V5 retry conditions + inertness — headless (parts 3, 5)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: "Part 3 — the retry conditions, on the stub and on the real fixture"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v5.mjs --part 3 --no-summary --assert | tee v5-3.txt

      # ⛔ Nothing chosen ⇒ nothing moved: the opening, M15 → M24, R3a's M22 leg and Something Tree, to the HASH.
      - name: "Part 5 — inertness, to the hash"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v5.mjs --part 5 --no-summary --assert | tee v5-5.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## V5 retry conditions + inertness — headless'
            echo ''
            echo '```'
            cat v5-3.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|green$' || echo 'no output'
            cat v5-5.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|green$' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-node
          path: tools/harness/results/tmp/gates-v5-part*-last.json
          if-no-files-found: warn
          retention-days: 14

  # ⛔ OWED FROM R3b-1 (plan §35 item 2): the whole-stretch WEIGHT leg had been measured by hand and never run as a
  # battery. Three 21,000-tick cells — its own job, because a battery killed by a timeout prints fewer rows.
  r3b-ratio:
    name: R3b row cycle — the whole-stretch ratio (part 7)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: "Part 7 — a weight of W buys W resets a round (W = 5, 20, and 60 at the shipped K)"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-r3b.mjs --part 7 --no-summary --assert --repeat7 1 --pool 3 | tee r3b-7.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## R3b row cycle — the whole-stretch ratio'
            echo ''
            echo '```'
            cat r3b-7.txt 2>/dev/null | grep -E 'VERDICT|REFUSED|^RED|green$' || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3b-ratio
          path: tools/harness/results/tmp/gates-r3b-part7-last.json
          if-no-files-found: warn
          retention-days: 14

  anchors:
    name: S1 part 1 — automation anchors
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # `--no-summary`: results/SUMMARY.md is the committed record of runs a person ran and read. A CI run appending
      # to a file nobody commits is a write into the void; the JSON below is this run's record.
      # `--pool`: the child pool is sized for a workstation. A hosted runner has 4 cores.
      - name: S1 part 1
        shell: bash  # bash -eo pipefail: without it `| tee` reports the pipe's status and a red row is lost
        run: node tools/harness/gates-s1.mjs --part 1 --no-summary --pool 4 | tee s1.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## S1 part 1 — the automation anchors'
            echo ''
            echo '```'
            tail -40 s1.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-part1
          path: tools/harness/results/tmp/gates-s1-part1-last.json
          if-no-files-found: warn
          retention-days: 14

  # F1-rows: the `maxRow` defect this slice found, held to the PLAIN page over all 171 games (plain boot vs automation
  # boot, one tick each; the engine's `maxRow` and `TREE_LAYERS` byte-equal; the repair fires on exactly four games).
  f1-rows:
    name: F1 rows — maxRow / TREE_LAYERS equal to the plain page, every game
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: F1 part rows
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-f1.mjs --part rows --pool 4 --no-summary --assert | tee f1-rows.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## F1 rows'
            echo ''
            echo '```'
            cat f1-rows.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  # ---- V6: every feature's toggle in the ADVANCED view, synchronised with the Simple grid (⚖ Q5, brief tmt-auto-20)
  # ⛔ A GATE, not a table (§49d's rule): every row asserts a constructed behaviour — synchronised both ways with no
  # reload, the toggle changes what the feature DOES (managed start, counts compared), reload persistence, arming,
  # the override display, the reset — so it runs on every push. The roster leg (part 7) is a recorded run, not CI.
  v6-page:
    name: V6 Advanced toggles — in the page (parts 1–6)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # ⚠ `--part page` runs parts 1–6 in one browser and `--assert` requires exactly 18 rows, all green: a battery
      # that dies part-way prints fewer rows, and fewer rows is fewer reds.
      - name: "Parts 1–6 — both ways, what it does, reload, arming, overrides, the reset (ptr AND something)"
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-v6.mjs --part page --no-summary --assert | tee v6.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## V6 Advanced toggles — in the page'
            echo ''
            echo '```'
            cat v6.txt 2>/dev/null | grep -E 'VERDICT|^RED|^GREEN' | cut -c1-300 || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-page
          path: tools/harness/results/tmp/gates-v6-part*-last.json
          if-no-files-found: warn
          retention-days: 14
